<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Overview tab mockup</title>
<style>
/* Tokens copied from src/styles.css (:root and [data-theme='dark']). No invented palette. */
:root {
  --yf-cream: #F8F7EF; --yf-mist: #ECF8F4; --yf-peach: #FFF2E8;
  --yf-navy: #123F49; --yf-teal-600: #0D8D82; --yf-teal-100: #E5F4EE;
  --yf-saffron-100: #FFF4E4; --yf-saffron: #F3AA3D; --yf-purple: #897ABB; --yf-amber: #E4AE43;
  --card: #FFFFFF; --text: #0B2545; --text-2: #45566E; --text-3: #5A6A80;
  --line: #E4DCCC; --yf-border: #DCE7E1;
  --teal-deep: #0E7A72; --ink-teal: #0B6B63; --teal-soft: #E5F4EE;
  --ok: #2E8B57; --ok-soft: #E3F2EA; --ink-green: #1F6B43;
  --warn: #B47207; --warn-soft: #FBF1DD; --ink-amber: #8F5B06;
  --danger: #C93B3B; --danger-soft: #F9E7E7; --ink-coral: #A82E2E; --info-soft: #E8EEF6;
  --btn-accent: #F3AA3D; --btn-accent-fg: #0B2545;
  --yf-nav-glass: rgba(255,255,255,.58); --yf-glass-border: rgba(255,255,255,.65);
  --shadow-navy-rgb: 11, 37, 69;
  --shadow-soft: 0 2px 6px rgba(var(--shadow-navy-rgb),.04), 0 16px 40px rgba(var(--shadow-navy-rgb),.10);
  --shadow-card: 0 1px 2px rgba(var(--shadow-navy-rgb),.05), 0 8px 28px rgba(var(--shadow-navy-rgb),.08);
  --radius: 18px; --radius-sm: 12px; --radius-lg: 24px;
  --ring: 0 0 0 3px var(--yf-teal-600);
  --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
  --space-1: 2px; --space-2: 4px; --space-3: 6px; --space-4: 8px; --space-5: 12px; --space-6: 14px; --space-7: 16px; --space-8: 20px; --space-9: 22px; --space-10: 24px;
  --container-w: 1400px; --container-wide: 1720px;
  --motion-fast: 120ms; --motion-med: 180ms; --motion-slow: 240ms;
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --stagger-step: 60ms;
  --atmos-mint: rgba(124,225,207,.20); --atmos-peach: rgba(255,179,107,.16);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --yf-cream: #0C1420; --yf-mist: #0F1B2B; --yf-peach: #1A2030;
  --yf-navy: #0F2A33; --yf-teal-600: #2BB8AC; --yf-teal-100: #12332F;
  --yf-saffron-100: #3A2C15; --yf-saffron: #F5A94A; --yf-purple: #A99BD6; --yf-amber: #D99A2B;
  --card: #16233A; --text: #ECF1F8; --text-2: #ADBCCF; --text-3: #8FA0B5;
  --line: #27395A; --yf-border: #27395A;
  --teal-deep: #35C9BC; --ink-teal: #35C9BC; --teal-soft: #12332F;
  --ok: #52BE80; --ok-soft: #16301F; --ink-green: #52BE80;
  --warn: #D99A2B; --warn-soft: #36290F; --ink-amber: #D99A2B;
  --danger: #E06C6C; --danger-soft: #3A2020; --ink-coral: #E06C6C; --info-soft: #1B2B45;
  --btn-accent: #F5A94A; --btn-accent-fg: #0C1420;
  --yf-nav-glass: rgba(16,27,43,.58); --yf-glass-border: rgba(255,255,255,.14);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-soft: 0 2px 8px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
  --atmos-mint: rgba(43,184,172,.10); --atmos-peach: rgba(245,169,74,.08);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  margin: 0; font-family: var(--font-body); color: var(--text); background: var(--yf-cream);
  background-image:
    radial-gradient(900px 420px at 8% -80px, var(--atmos-mint), transparent 70%),
    radial-gradient(800px 380px at 96% -60px, var(--atmos-peach), transparent 70%);
  background-repeat: no-repeat; font-size: 15px; line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--ring); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- Mockup chrome (not part of the product) ---- */
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px; background: var(--card); border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--text-2); }
.mock-bar b { color: var(--text); }
.mock-bar .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.mock-bar button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--text-2); }
.mock-bar button[aria-pressed='true'] { background: var(--teal-soft); color: var(--ink-teal); border-color: var(--yf-teal-600); }
.mock-note { margin: 0 0 var(--space-5); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; font-size: 12px; color: var(--text-2); background: color-mix(in srgb, var(--card) 60%, transparent); }
.app-nav-stub { display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 0 20px; font-size: 13px; font-weight: 700; color: var(--text-3); }
.app-nav-stub .brand { color: var(--ink-teal); font-weight: 800; font-size: 16px; }

/* ---- Container and P2 header (unchanged by P12, shown for context) ---- */
.container { position: relative; width: 100%; max-width: var(--container-w); margin: 0 auto; padding: var(--space-7) var(--space-8) 0; }
.guide-on .container::before { content: attr(data-w); position: absolute; top: 2px; left: 50%; transform: translateX(-50%); z-index: 41; padding: 1px 8px; border-radius: 999px; font: 700 11px var(--font-body); background: var(--yf-teal-600); color: var(--card); white-space: nowrap; }
.yf-trip-head { position: relative; overflow: hidden; margin-bottom: var(--space-5); padding: var(--space-6) var(--space-8); background: var(--card); border: 1px solid var(--yf-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
.yf-trip-head::after { content: ''; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: var(--yf-saffron-100); opacity: .9; pointer-events: none; }
:root[data-theme='dark'] .yf-trip-head::after { opacity: .4; }
.yf-trip-head > * { position: relative; z-index: 1; }
.yf-back { display: inline-flex; align-items: center; min-height: 44px; margin: -10px 0 -8px -12px; padding: 0 12px; border: 0; background: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-3); }
.yf-head-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; column-gap: var(--space-7); align-items: start; }
.yf-thumb { width: 72px; height: 72px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--yf-border); background: var(--yf-mist); }
.yf-thumb svg { display: block; width: 100%; height: 100%; }
.yf-head-title { margin: 0; min-height: 40px; display: flex; align-items: center; font-family: var(--font-serif); font-weight: 600; color: var(--text); font-size: clamp(1.5rem, 1.1rem + 1.2vw, 2rem); line-height: 1.1; letter-spacing: -.015em; }
.yf-head-meta { padding-top: 0; color: var(--text-2); font-size: 14px; }
.yf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; background: var(--btn-accent); color: var(--btn-accent-fg); box-shadow: 0 1px 2px rgba(var(--shadow-navy-rgb),.12); transition: filter var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.yf-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.yf-btn:active { transform: translateY(0); }
.yf-btn--quiet { background: transparent; color: var(--ink-teal); border: 1px solid var(--line); box-shadow: none; transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.yf-btn--quiet:hover { background: var(--teal-soft); filter: none; }
.yf-act-extra { display: none; }
.yf-members { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-top: var(--space-4); }
.yf-avatars { display: flex; align-items: center; }
.avatar { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 32px; height: 32px; margin-inline-start: -8px; border-radius: 50%; border: 2px solid var(--card); background: var(--teal-soft); color: var(--ink-teal); font-weight: 800; font-size: 12px; }
.avatar:first-child { margin-inline-start: 0; }
.avatar:nth-child(2) { background: var(--yf-saffron); color: #0B2545; }
.avatar:nth-child(3) { background: var(--yf-purple); color: #0B2545; }
.yf-member-note { font-size: 13px; color: var(--text-2); }
.yf-member-note b { color: var(--text); }
.yf-tabbar { position: relative; display: flex; gap: 2px; padding: 4px; margin-bottom: var(--space-5); border-radius: 999px; overflow-x: auto; scrollbar-width: none; background: var(--yf-nav-glass); border: 1px solid var(--yf-glass-border); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: var(--shadow-soft); }
.yf-tabbar::-webkit-scrollbar { display: none; }
.yf-tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 0; background: none; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
.yf-tab[aria-selected='true'] { color: var(--ink-teal); font-weight: 700; background: var(--teal-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yf-teal-600) 28%, transparent); }
.yf-count { background: var(--card); color: var(--ink-teal); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 1px solid var(--yf-border); }

/* ================= P12 Overview (all new rules; ovw- prefix) =================
   Spacing steps come from the --space-* tokens (styles.css:181). Every gap is one step below the first draft. */
.ovw { display: grid; gap: var(--space-5); padding-bottom: var(--space-8); font-variant-numeric: tabular-nums; --mx-tint: 16%; --mx-ring: 55%; --mx-edge: color-mix(in srgb, var(--text-3) 80%, var(--card)); }
.ovw-card { background: var(--card); border: 1px solid var(--yf-border); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: var(--space-7); min-width: 0; }
.ovw-title { font-family: var(--font-body); font-size: 18px; font-weight: 800; line-height: 1.3; color: var(--text); }
.ovw-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-4); min-height: 28px; }
.ovw-head-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-3) var(--space-5); font-size: 12px; color: var(--text-2); }

/* Buttons: one primary (accent pill), one secondary (outline pill), one quiet (text). All 44px tall. */
.ovw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 800; white-space: nowrap; border: 1.5px solid var(--line); background: transparent; color: var(--ink-teal); transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), filter var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.ovw-btn:hover { background: var(--teal-soft); border-color: var(--yf-teal-600); }
.ovw-btn:active { transform: translateY(1px); }
.ovw-btn--primary { border: 0; background: var(--btn-accent); color: var(--btn-accent-fg); box-shadow: 0 1px 2px rgba(var(--shadow-navy-rgb),.12); padding: 0 22px; font-size: 15px; }
.ovw-btn--primary:hover { background: var(--btn-accent); filter: brightness(1.06); transform: translateY(-1px); }
.ovw-btn--quiet { border-color: transparent; padding: 0 12px; margin-inline-start: -12px; }
.ovw-head-btn { margin-block: -8px; margin-inline: 0 -12px; }
/* Text link that opens another tab: 44px target, 40px with a fine pointer. */
.ovw-link { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 800; color: var(--ink-teal); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: 8px; }
.ovw-link:hover { color: var(--text); }
.ovw-link:focus-visible { outline: 2px solid transparent; box-shadow: var(--ring); }
@media (pointer: fine) { .ovw-link { min-height: 40px; } }
.yf-head-foot { display: block; }

/* 1. Verdict: one slim band */
.ovw-verdict { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-7); padding: var(--space-5) var(--space-8) var(--space-5) var(--space-9); }
.ovw-verdict > * { position: relative; z-index: 1; }
.ovw-verdict[data-band='ok'] { --band-fill: var(--ok); --band-ink: var(--ink-green); --band-soft: var(--ok-soft); }
.ovw-verdict[data-band='teal'] { --band-fill: var(--yf-teal-600); --band-ink: var(--ink-teal); --band-soft: var(--teal-soft); }
.ovw-verdict[data-band='saffron'] { --band-fill: var(--yf-saffron); --band-ink: var(--ink-amber); --band-soft: var(--warn-soft); }
.ovw-verdict[data-band='danger'] { --band-fill: var(--danger); --band-ink: var(--ink-coral); --band-soft: var(--danger-soft); }
.ovw-score { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: baseline; gap: 0 var(--space-3); }
.ovw-score-num { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--band-ink); }
.ovw-score-of { font-size: 12px; font-weight: 700; color: var(--text-3); }
.ovw-band { grid-column: 1 / -1; display: inline-flex; align-items: center; justify-self: start; min-height: 22px; margin-top: var(--space-3); padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--band-soft); color: var(--band-ink); }
.ovw-verdict-text { min-width: 0; display: grid; gap: var(--space-2); }
.ovw-verdict-line { font-family: var(--font-body); font-size: 18px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.ovw-verdict-sub { color: var(--text-2); font-size: 13px; }
.ovw-bar { height: 6px; border-radius: 999px; background: var(--info-soft); overflow: hidden; margin-top: var(--space-2); }
.ovw-bar i { display: block; height: 100%; border-radius: 999px; background: var(--band-fill); transform-origin: 0 50%; animation: growX calc(var(--motion-slow) * 2) var(--ease-out) backwards; animation-delay: calc(var(--stagger-step) * 2); }

/* 2. Stat row: three slim tiles, label and value on one line */
.ovw-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
.ovw-stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-5); padding: var(--space-4) var(--space-7); }
.ovw-stat-label { grid-column: 1; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.ovw-stat-val { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; text-align: right; }
.ovw-stat-sub { grid-column: 1; font-size: 12px; color: var(--text-2); }

/* 3. What needs you (left) beside the route (right) */
.ovw-split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-5); align-items: stretch; grid-template-areas: 'needs route' 'stats stats'; }
.ovw-needs { display: flex; flex-direction: column; }
.ovw-count { display: inline-flex; align-items: center; min-height: 22px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--warn-soft); color: var(--ink-amber); }
.ovw-need-list { display: grid; }
.ovw-need { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2) var(--space-5); align-items: center; padding: var(--space-5) 0; border-top: 1px solid var(--line); }
.ovw-need:first-child { border-top: 0; padding-top: 0; }
.ovw-sev {
  display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 10px 0 8px;
  border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap;
}
.ovw-sev svg { width: 14px; height: 14px; flex: 0 0 auto; }
.ovw-sev[data-sev='high'] { background: var(--danger-soft); color: var(--ink-coral); }
.ovw-sev[data-sev='medium'] { background: var(--warn-soft); color: var(--ink-amber); }
.ovw-sev[data-sev='low'] { background: var(--info-soft); color: var(--text-2); }
.ovw-need-title { font-weight: 800; font-size: 14px; line-height: 1.3; }
.ovw-need-fix { color: var(--text-2); font-size: 13px; line-height: 1.35; }
.ovw-more-btn { align-self: flex-start; margin-top: auto; min-height: 44px; padding: 0; border: 0; background: none; font-size: 13px; font-weight: 800; color: var(--ink-teal); text-decoration: underline; text-underline-offset: 3px; }
.ovw-need-list[hidden] { display: none; }
.ovw-btn--review { min-height: 44px; }
@media (pointer: fine) { .ovw-btn--review { min-height: 40px; } }
.ovw-split > .ovw-needs { grid-area: needs; }
.ovw-split > .ovw-route { grid-area: route; }
.ovw-split > .ovw-stats { grid-area: stats; }

/* 4. Route card: the route is the picture. Names and numbers sit in the tooltip and the stop list. */
.ovw-route { display: flex; flex-direction: column; gap: var(--space-4); }
.ovw-route .ovw-head { margin-bottom: 0; }
/* The map plate follows the dark route plate of RouteSnapshot. The road colours come from the saffron and danger tokens. */
.ovw-map {
  --rm-a: var(--yf-saffron);
  --rm-b: color-mix(in srgb, var(--yf-saffron) 45%, #fff);
  --rm-c: color-mix(in srgb, var(--danger) 60%, var(--yf-saffron));
  --rm-cream: color-mix(in srgb, var(--yf-saffron) 14%, #fff);
  position: relative; border-radius: var(--radius-sm); overflow: hidden; color: #fff;
  background-color: var(--yf-navy);
  background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(150deg, var(--yf-navy), var(--btn-accent-fg) 88%);
  background-size: 26px 26px, 26px 26px, auto;
}
.ovw-map svg { display: block; width: 100%; height: auto; }
/* The line widths are custom properties, so the script can widen them when the map shrinks on a phone. */
.rm-case { fill: none; stroke: rgba(var(--shadow-navy-rgb), .6); stroke-width: var(--cw, 15px); stroke-linecap: round; stroke-linejoin: round; }
.rm-hl { fill: none; stroke: var(--rm-b); stroke-width: var(--gw, 24px); stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity var(--motion-fast) var(--ease-out); }
.rm-hl.is-hl { opacity: .4; }
.rm-road { fill: none; stroke-width: var(--rw, 8px); stroke-linecap: round; stroke-linejoin: round; transition: stroke-width var(--motion-fast) var(--ease-out); }
.rm-road.is-hl { stroke-width: calc(var(--rw, 8px) * 1.35); }
.rm-dash { fill: none; stroke: var(--rm-cream); stroke-width: var(--dw, 2px); stroke-dasharray: var(--dd, 7 9); stroke-linecap: round; }
.rm-leghit { fill: none; stroke: transparent; stroke-width: var(--hw, 18px); pointer-events: stroke; }
/* Draw-in: each leg draws once, one stagger step after the leg before it. The dashes fade in with the road. */
.rm-case, .rm-road { stroke-dasharray: 1; stroke-dashoffset: 0; animation: rmDraw var(--motion-slow) var(--ease-out) backwards; animation-delay: calc(var(--stagger-step) * var(--i, 0)); }
.rm-dash { animation: rmFade var(--motion-slow) var(--ease-out) backwards; animation-delay: calc(var(--stagger-step) * var(--i, 0)); }
@keyframes rmDraw { from { stroke-dashoffset: 1; } }
@keyframes rmFade { from { opacity: 0; } }
/* Pin: a small face over a transparent hit circle of 44px. Hover, focus and a matching list row draw a 2px ring. */
.rm-pin { cursor: pointer; outline: none; }
.rm-pin[data-inert] { pointer-events: none; }
.rm-hit { fill: transparent; }
.rm-ring { fill: none; stroke: #fff; stroke-width: 2px; opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out); }
.rm-pin:hover .rm-ring, .rm-pin:focus-visible .rm-ring, .rm-pin.is-hl .rm-ring { opacity: 1; }
.rm-dot { fill: #fff; stroke: var(--yf-teal-600); stroke-width: var(--pw, 2px); }
.is-start .rm-dot { fill: var(--teal-deep); stroke: #fff; }
.is-end .rm-dot { fill: var(--yf-saffron); stroke: #fff; }

.ovw-verdict-act { display: grid; justify-items: end; }

/* Stop list: one compact row for each stop, two columns on a wide card. It is the text version of the route. */

/* 5. Day matrix: a grid, days as rows, parts as columns */
.ovw-block { background: var(--card); border: 1px solid var(--yf-border); border-radius: var(--radius-sm); padding: var(--space-6) var(--space-7); display: flex; flex-direction: column; min-width: 0; }

.mx-btn { all: unset; box-sizing: border-box; flex: 1; min-width: 0; min-height: 44px;
  display: flex; align-items: stretch; padding: 8px; border-radius: 16px; cursor: pointer; }
.mx-chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text); transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out), box-shadow var(--motion-fast) var(--ease-out); }
.mx-chip svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--k); }
.mx-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mx-btn:focus-visible { outline: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--yf-teal-600); }
.mx-cell[data-state='filled'] .mx-chip { background: color-mix(in srgb, var(--k) var(--mx-tint), var(--card)); }
@media (hover: hover) { .mx-cell[data-state='filled'] .mx-btn:hover .mx-chip { background: color-mix(in srgb, var(--k) 26%, var(--card)); } }

/* Small blocks */
.ovw-pulse-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-5); min-height: 44px; border-top: 1px solid var(--line); }

/* StateBlock, compact (R22): same roles, no dashed border. Copy of .yf-state rules. */
.yf-state { display: grid; justify-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-2); text-align: center; }

.spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--yf-teal-600); animation: spin calc(var(--motion-slow) * 4) linear infinite; }

/* Entrance: same idea as .page-enter. Tokens only. */
@keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: none; } }

.ovw > * { animation: riseIn var(--motion-slow) var(--ease-out) backwards; }
.ovw > *:nth-child(2) { animation-delay: var(--stagger-step); }

/* Guide overlay: ?guides=1 draws the 1400px container and the 1720px Board and Map width */

  }

  function weather(s) {
    var cells = [['Day 1', 'sun', '31° / 22°', 'Dry', 0], ['Day 2', 'rain', '27° / 20°', 'Rain 70%', 1], ['Day 3', 'rain', '24° / 18°', 'Rain 50%', 1], ['Day 4', 'sun', '22° / 14°', 'Dry', 0], ['Day 5', 'sun', '19° / 9°', 'Dry', 0]];
    var grid = '<div class="ovw-wx">' + cells.map(function (c) {
      return '<div class="ovw-wx-cell' + (c[4] ? ' wet' : '') + '">' + I[c[1]] + '<span>' + c[0] + '</span><b>' + c[2] + '</b><span>' + c[3] + '</span></div>';
    }).join('') + '</div>';
    var body, meta = '';
    if (s === 'loading') body = state('loading', { icon: spin, title: 'Loading forecast' });
    else if (s === 'failed') body = state('failed', { icon: I.warn, title: 'Couldn’t load the forecast', body: 'The request failed. It does not mean the weather is clear.', actions: retry });
    else if (s === 'empty') body = state('empty', { title: 'No forecast yet', body: 'A forecast appears when a day comes close enough.' });
    else if (s === 'kept') body = state('kept', { icon: I.warn, title: 'Couldn’t refresh the forecast', body: 'Showing the last one.', actions: retry }) + grid;
    else { body = grid; meta = '<div class="ovw-head-meta">Rain is likely on Day 2 and Day 3. Pack rain gear.</div>'; }
    return '<section class="ovw-block ovw-weather" aria-labelledby="w-h"><div class="ovw-head"><h2 class="ovw-title" id="w-h">Weather along the route</h2>' + meta + '</div>' + body + '</section>';
  }

  var notes = {
    ready: 'Ready: every panel has data.',
    loading: 'Loading: weather, group pulse and recent activity wait for a read. The verdict, issues, totals, route, commitments and day matrix come from the plan already on screen, so they stay as they are.',
    failed: 'Failed: three reads failed and each says so with Try again. A failed read never shows as empty.',
    empty: 'Empty: a trip with nothing planned. The score reads a dash, the totals read a dash, and nothing is invented.',
    kept: 'Kept: a refresh failed, so the last loaded rows stay on screen with a note.'
  };

  /* The map shrinks with its card, so the drawing is sized again whenever its width changes. */
  var mapWatch = null;
  function fitMap(m, svg, R) {
    if (mapWatch) mapWatch.disconnect();
    var run = function () { layoutMap(svg, R, svg.getBoundingClientRect().width / W); };
    run();
    if (window.ResizeObserver) { mapWatch = new ResizeObserver(run); mapWatch.observe(m); }
  }

  /* Pin, list row and the leg that arrives at the stop share one index. Hover or focus on any of them lights the other two
     and opens the tooltip on the map. Escape closes the tooltip. */
  function setHl(i, on) {
    Array.prototype.forEach.call(document.querySelectorAll('#ovw [data-stop="' + i + '"], #ovw [data-to="' + i + '"]'), function (e) { e.classList.toggle('is-hl', on); });
  }
  var hlIndex = -1;
  function clearHl() {
    if (hlIndex >= 0) setHl(hlIndex, false);
    hlIndex = -1;
    var tip = document.getElementById('rmTip'); if (tip) tip.classList.remove('is-on');
  }
  function showTip(R, i, leg) {
    var m = document.getElementById('rmap'), tip = document.getElementById('rmTip'), svg = m && m.querySelector('svg');
    if (!tip || !svg) return;
    var p = R.pts[i], L = R.legs[i - 1], sc = svg.getBoundingClientRect().width / W, x = p.x, y = p.y, html;
    if (leg && L) {
      var mid = R.samples[(i - 1) * 11 + 5]; x = mid[0]; y = mid[1];
      html = '<b>' + L.from + ' to ' + L.to + '</b>' + (ROAD_OK ? '<span>' + L.km.toLocaleString('en-IN') + ' km, ' + hm(L.min) + '</span>' : '<span>Road not measured yet</span>') + '<span>' + (L.a === L.b ? 'Day ' + L.a : 'Days ' + L.a + '–' + L.b) + '</span>';
    } else {
      var tag = R.pts.length > 1 && i === 0 ? 'Start' : (R.pts.length > 1 && i === R.pts.length - 1 ? 'End' : '');
      html = '<b>' + p.n + '</b><span>Day ' + p.day + (tag ? ', ' + tag.toLowerCase() : '') + '</span>' + (L ? (ROAD_OK ? '<span>' + L.km.toLocaleString('en-IN') + ' km, ' + hm(L.min) + ' from ' + L.from + '</span>' : '<span>Road not measured yet</span>') : '');
    }
    tip.innerHTML = html; tip.classList.toggle('is-below', y * sc < 96); tip.classList.add('is-on');
    var w = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(x * sc, w / 2 + 6), m.clientWidth - w / 2 - 6) + 'px'; tip.style.top = (y * sc) + 'px';
  }
  function activate(t) {
    if (!curR || !t) return;
    var leg = t.hasAttribute('data-to') && !t.hasAttribute('data-stop');
    var i = +(t.getAttribute('data-stop') || t.getAttribute('data-to'));
    if (i === hlIndex && !leg) return;
    clearHl(); hlIndex = i; setHl(i, true); showTip(curR, i, leg);
  }

  /* Mockup only: a click shows where the real tab would go. */
  var toastEl = document.getElementById('toast'), toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }
  var ovwEl = document.getElementById('ovw');
  ovwEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open]'); if (t) toast('Would open: ' + t.getAttribute('data-open'));
  });
  ovwEl.addEventListener('keydown', function (e) {
    var p = e.target.closest && e.target.closest('.rm-pin');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toast('Would open: ' + p.getAttribute('data-open')); }
  });
  var LINKED = '[data-stop], .rm-leghit';
  ovwEl.addEventListener('mouseover', function (e) { var t = e.target.closest && e.target.closest(LINKED); if (t) activate(t); });
  ovwEl.addEventListener('mouseout', function (e) { var t = e.target.closest && e.target.closest(LINKED); if (t && !t.contains(e.relatedTarget)) clearHl(); });
  ovwEl.addEventListener('focusin', function (e) { var t = e.target.closest && e.target.closest('[data-stop]'); if (t) activate(t); });
  ovwEl.addEventListener('focusout', function () { clearHl(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') clearHl(); });

  function render(s) {
    alertUsed = false;
    /* The strings build in page order, so the first failed block on the page is the one alert. */
    var html = verdict(s) + '<div class="ovw-split">' + needs(s) + route(s) + stats(s) + '</div>' +
      '<div class="ovw-lower">' + matrix(s) + '<div class="ovw-stack">' + pulse(s) + commitments(s) + activity(s) + '</div></div>' + weather(s);
    document.getElementById('ovw').innerHTML = html;
    var m = document.getElementById('rmap'); if (m && curR) { var msvg = buildMap(curR); m.insertBefore(msvg, m.firstChild); fitMap(m, msvg, curR); }
    hlIndex = -1;
    var mb = document.getElementById('moreBtn');
    if (mb) mb.addEventListener('click', function () {
      var rows = document.getElementById('moreRows'), open = rows.hidden;
      rows.hidden = !open; mb.setAttribute('aria-expanded', String(open)); mb.textContent = open ? 'Show fewer' : (WARN.length - 3) + ' more warnings';
    });
    wireMatrix();
    document.getElementById('note').innerHTML = '<p class="mock-note">' + notes[s] + '</p>';
    Array.prototype.forEach.call(document.querySelectorAll('.mock-bar [data-state]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-state') === s)); });
  }

  /* ---------- theme, guides and state from the URL ---------- */
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    var b = document.getElementById('themeBtn'); b.setAttribute('aria-pressed', String(t === 'dark')); b.textContent = t === 'dark' ? 'Dark (on)' : 'Dark';
  }
  var t0 = qs.get('theme');
  if (t0 !== 'light' && t0 !== 'dark') t0 = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  setTheme(t0);
  if (qs.get('guides') === '1') {
    document.body.classList.add('guide-on');
    var cont = document.querySelector('.container'); cont.setAttribute('data-w', 'Container ' + getComputedStyle(cont).maxWidth + ' (normal tabs)');
    var gw = document.createElement('div'); gw.className = 'guide-wide'; gw.setAttribute('aria-hidden', 'true');
    gw.innerHTML = '<span>Board and Map ' + getComputedStyle(root).getPropertyValue('--container-wide').trim() + '</span>'; document.body.appendChild(gw);
  }
  document.getElementById('themeBtn').addEventListener('click', function () {
    var n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(n); qs.set('theme', n); history.replaceState(null, '', '?' + qs.toString());
  });
  var s0 = qs.get('state'); if (STATES.indexOf(s0) < 0) s0 = 'ready';
  render(s0);
  Array.prototype.forEach.call(document.querySelectorAll('.mock-bar [data-state]'), function (b) {
    b.addEventListener('click', function () {
      var n = b.getAttribute('data-state'); qs.set('state', n); history.replaceState(null, '', '?' + qs.toString()); render(n);
    });
  });
})();
</script>
</body>
</html>
