<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Overview tab mockup</title>
<style>
/* Tokens copied from src/styles.css (:root and [data-theme='dark']). No invented palette. */
:root {
  --yf-cream: #F8F7EF; --yf-mist: #ECF8F4; --yf-peach: #FFF2E8;
  --yf-navy: #123F49; --yf-teal-600: #0D8D82; --yf-teal-100: #E5F4EE;
  --yf-saffron-100: #FFF4E4; --yf-saffron: #F3AA3D; --yf-purple: #897ABB; --yf-amber: #E4AE43;
  --card: #FFFFFF; --text: #0B2545; --text-2: #45566E; --text-3: #5A6A80;
  --line: #E4DCCC; --yf-border: #DCE7E1;
  --teal-deep: #0E7A72; --ink-teal: #0B6B63; --teal-soft: #E5F4EE;
  --ok: #2E8B57; --ok-soft: #E3F2EA; --ink-green: #1F6B43;
  --warn: #B47207; --warn-soft: #FBF1DD; --ink-amber: #8F5B06;
  --danger: #C93B3B; --danger-soft: #F9E7E7; --ink-coral: #A82E2E; --info-soft: #E8EEF6;
  --btn-accent: #F3AA3D; --btn-accent-fg: #0B2545;
  --yf-nav-glass: rgba(255,255,255,.58); --yf-glass-border: rgba(255,255,255,.65);
  --shadow-navy-rgb: 11, 37, 69;
  --shadow-soft: 0 2px 6px rgba(var(--shadow-navy-rgb),.04), 0 16px 40px rgba(var(--shadow-navy-rgb),.10);
  --shadow-card: 0 1px 2px rgba(var(--shadow-navy-rgb),.05), 0 8px 28px rgba(var(--shadow-navy-rgb),.08);
  --radius: 18px; --radius-sm: 12px; --radius-lg: 24px;
  --ring: 0 0 0 3px var(--yf-teal-600);
  --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
  --space-1: 2px; --space-2: 4px; --space-3: 6px; --space-4: 8px; --space-5: 12px; --space-6: 14px; --space-7: 16px; --space-8: 20px; --space-9: 22px; --space-10: 24px;
  --container-w: 1400px; --container-wide: 1720px;
  --motion-fast: 120ms; --motion-med: 180ms; --motion-slow: 240ms;
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --stagger-step: 60ms;
  --atmos-mint: rgba(124,225,207,.20); --atmos-peach: rgba(255,179,107,.16);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --yf-cream: #0C1420; --yf-mist: #0F1B2B; --yf-peach: #1A2030;
  --yf-navy: #0F2A33; --yf-teal-600: #2BB8AC; --yf-teal-100: #12332F;
  --yf-saffron-100: #3A2C15; --yf-saffron: #F5A94A; --yf-purple: #A99BD6; --yf-amber: #D99A2B;
  --card: #16233A; --text: #ECF1F8; --text-2: #ADBCCF; --text-3: #8FA0B5;
  --line: #27395A; --yf-border: #27395A;
  --teal-deep: #35C9BC; --ink-teal: #35C9BC; --teal-soft: #12332F;
  --ok: #52BE80; --ok-soft: #16301F; --ink-green: #52BE80;
  --warn: #D99A2B; --warn-soft: #36290F; --ink-amber: #D99A2B;
  --danger: #E06C6C; --danger-soft: #3A2020; --ink-coral: #E06C6C; --info-soft: #1B2B45;
  --btn-accent: #F5A94A; --btn-accent-fg: #0C1420;
  --yf-nav-glass: rgba(16,27,43,.58); --yf-glass-border: rgba(255,255,255,.14);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-soft: 0 2px 8px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
  --atmos-mint: rgba(43,184,172,.10); --atmos-peach: rgba(245,169,74,.08);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  margin: 0; font-family: var(--font-body); color: var(--text); background: var(--yf-cream);
  background-image:
    radial-gradient(900px 420px at 8% -80px, var(--atmos-mint), transparent 70%),
    radial-gradient(800px 380px at 96% -60px, var(--atmos-peach), transparent 70%);
  background-repeat: no-repeat; font-size: 15px; line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--ring); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- Mockup chrome (not part of the product) ---- */
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px; background: var(--card); border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--text-2); }
.mock-bar b { color: var(--text); }
.mock-bar .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.mock-bar button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--text-2); }
.mock-bar button[aria-pressed='true'] { background: var(--teal-soft); color: var(--ink-teal); border-color: var(--yf-teal-600); }
.mock-note { margin: 0 0 var(--space-5); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; font-size: 12px; color: var(--text-2); background: color-mix(in srgb, var(--card) 60%, transparent); }
.app-nav-stub { display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 0 20px; font-size: 13px; font-weight: 700; color: var(--text-3); }
.app-nav-stub .brand { color: var(--ink-teal); font-weight: 800; font-size: 16px; }

/* ---- Container and P2 header (unchanged by P12, shown for context) ---- */
.container { position: relative; width: 100%; max-width: var(--container-w); margin: 0 auto; padding: var(--space-7) var(--space-8) 0; }
.guide-on .container::before { content: attr(data-w); position: absolute; top: 2px; left: 50%; transform: translateX(-50%); z-index: 41; padding: 1px 8px; border-radius: 999px; font: 700 11px var(--font-body); background: var(--yf-teal-600); color: var(--card); white-space: nowrap; }
.yf-trip-head { position: relative; overflow: hidden; margin-bottom: var(--space-5); padding: var(--space-6) var(--space-8); background: var(--card); border: 1px solid var(--yf-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
.yf-trip-head::after { content: ''; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: var(--yf-saffron-100); opacity: .9; pointer-events: none; }
:root[data-theme='dark'] .yf-trip-head::after { opacity: .4; }
.yf-trip-head > * { position: relative; z-index: 1; }
.yf-back { display: inline-flex; align-items: center; min-height: 44px; margin: -10px 0 -8px -12px; padding: 0 12px; border: 0; background: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-3); }
.yf-head-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; column-gap: var(--space-7); align-items: start; }
.yf-thumb { width: 72px; height: 72px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--yf-border); background: var(--yf-mist); }
.yf-thumb svg { display: block; width: 100%; height: 100%; }
.yf-head-title { margin: 0; min-height: 40px; display: flex; align-items: center; font-family: var(--font-serif); font-weight: 600; color: var(--text); font-size: clamp(1.5rem, 1.1rem + 1.2vw, 2rem); line-height: 1.1; letter-spacing: -.015em; }
.yf-head-meta { padding-top: 0; color: var(--text-2); font-size: 14px; }
.yf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; background: var(--btn-accent); color: var(--btn-accent-fg); box-shadow: 0 1px 2px rgba(var(--shadow-navy-rgb),.12); transition: filter var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.yf-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.yf-btn:active { transform: translateY(0); }
.yf-btn--quiet { background: transparent; color: var(--ink-teal); border: 1px solid var(--line); box-shadow: none; transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.yf-btn--quiet:hover { background: var(--teal-soft); filter: none; }
.yf-act-extra { display: none; }
.yf-members { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-top: var(--space-4); }
.yf-avatars { display: flex; align-items: center; }
.avatar { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 32px; height: 32px; margin-inline-start: -8px; border-radius: 50%; border: 2px solid var(--card); background: var(--teal-soft); color: var(--ink-teal); font-weight: 800; font-size: 12px; }
.avatar:first-child { margin-inline-start: 0; }
.avatar:nth-child(2) { background: var(--yf-saffron); color: #0B2545; }
.avatar:nth-child(3) { background: var(--yf-purple); color: #0B2545; }
.yf-member-note { font-size: 13px; color: var(--text-2); }
.yf-member-note b { color: var(--text); }
.yf-tabbar { position: relative; display: flex; gap: 2px; padding: 4px; margin-bottom: var(--space-5); border-radius: 999px; overflow-x: auto; scrollbar-width: none; background: var(--yf-nav-glass); border: 1px solid var(--yf-glass-border); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: var(--shadow-soft); }
.yf-tabbar::-webkit-scrollbar { display: none; }
.yf-tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 0; background: none; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
.yf-tab[aria-selected='true'] { color: var(--ink-teal); font-weight: 700; background: var(--teal-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yf-teal-600) 28%, transparent); }
.yf-count { background: var(--card); color: var(--ink-teal); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 1px solid var(--yf-border); }

/* ================= P12 Overview (all new rules; ovw- prefix) =================
   Spacing steps come from the --space-* tokens (styles.css:181). Every gap is one step below the first draft. */
.ovw { display: grid; gap: var(--space-5); padding-bottom: var(--space-8); font-variant-numeric: tabular-nums; --mx-tint: 16%; --mx-ring: 55%; --mx-edge: color-mix(in srgb, var(--text-3) 80%, var(--card)); }
.ovw-card { background: var(--card); border: 1px solid var(--yf-border); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: var(--space-7); min-width: 0; }
.ovw-title { font-family: var(--font-body); font-size: 18px; font-weight: 800; line-height: 1.3; color: var(--text); }
.ovw-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-4); min-height: 28px; }
.ovw-head-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-3) var(--space-5); font-size: 12px; color: var(--text-2); }

/* Buttons: one primary (accent pill), one secondary (outline pill), one quiet (text). All 44px tall. */
.ovw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 800; white-space: nowrap; border: 1.5px solid var(--line); background: transparent; color: var(--ink-teal); transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), filter var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out); }
.ovw-btn:hover { background: var(--teal-soft); border-color: var(--yf-teal-600); }
.ovw-btn:active { transform: translateY(1px); }
.ovw-btn--primary { border: 0; background: var(--btn-accent); color: var(--btn-accent-fg); box-shadow: 0 1px 2px rgba(var(--shadow-navy-rgb),.12); padding: 0 22px; font-size: 15px; }
.ovw-btn--primary:hover { background: var(--btn-accent); filter: brightness(1.06); transform: translateY(-1px); }
.ovw-btn--quiet { border-color: transparent; padding: 0 12px; margin-inline-start: -12px; }
.ovw-head-btn { margin-block: -8px; margin-inline: 0 -12px; }
/* Text link that opens another tab: 44px target, 40px with a fine pointer. */
.ovw-link { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 800; color: var(--ink-teal); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: 8px; }
.ovw-link:hover { color: var(--text); }
.ovw-link:focus-visible { outline: 2px solid transparent; box-shadow: var(--ring); }
@media (pointer: fine) { .ovw-link { min-height: 40px; } }
.yf-head-foot { display: block; }

/* 1. Verdict: one slim band */
.ovw-verdict { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-7); padding: var(--space-5) var(--space-8) var(--space-5) var(--space-9); }
.ovw-verdict > * { position: relative; z-index: 1; }
.ovw-verdict[data-band='ok'] { --band-fill: var(--ok); --band-ink: var(--ink-green); --band-soft: var(--ok-soft); }
.ovw-verdict[data-band='teal'] { --band-fill: var(--yf-teal-600); --band-ink: var(--ink-teal); --band-soft: var(--teal-soft); }
.ovw-verdict[data-band='saffron'] { --band-fill: var(--yf-saffron); --band-ink: var(--ink-amber); --band-soft: var(--warn-soft); }
.ovw-verdict[data-band='danger'] { --band-fill: var(--danger); --band-ink: var(--ink-coral); --band-soft: var(--danger-soft); }
.ovw-score { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: baseline; gap: 0 var(--space-3); }
.ovw-score-num { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--band-ink); }
.ovw-score-of { font-size: 12px; font-weight: 700; color: var(--text-3); }
.ovw-band { grid-column: 1 / -1; display: inline-flex; align-items: center; justify-self: start; min-height: 22px; margin-top: var(--space-3); padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--band-soft); color: var(--band-ink); }
.ovw-verdict-text { min-width: 0; display: grid; gap: var(--space-2); }
.ovw-verdict-line { font-family: var(--font-body); font-size: 18px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.ovw-verdict-sub { color: var(--text-2); font-size: 13px; }
.ovw-bar { height: 6px; border-radius: 999px; background: var(--info-soft); overflow: hidden; margin-top: var(--space-2); }
.ovw-bar i { display: block; height: 100%; border-radius: 999px; background: var(--band-fill); transform-origin: 0 50%; animation: growX calc(var(--motion-slow) * 2) var(--ease-out) backwards; animation-delay: calc(var(--stagger-step) * 2); }

/* 2. Stat row: three slim tiles, label and value on one line */
.ovw-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
.ovw-stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-5); padding: var(--space-4) var(--space-7); }
.ovw-stat-label { grid-column: 1; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.ovw-stat-val { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; text-align: right; }
.ovw-stat-sub { grid-column: 1; font-size: 12px; color: var(--text-2); }

/* 3. What needs you (left) beside the route (right) */
.ovw-split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-5); align-items: stretch; grid-template-areas: 'needs route' 'stats stats'; }
.ovw-needs { display: flex; flex-direction: column; }
.ovw-count { display: inline-flex; align-items: center; min-height: 22px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--warn-soft); color: var(--ink-amber); }
.ovw-need-list { display: grid; }
.ovw-need { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2) var(--space-5); align-items: center; padding: var(--space-5) 0; border-top: 1px solid var(--line); }
.ovw-need:first-child { border-top: 0; padding-top: 0; }
.ovw-sev {
  display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 10px 0 8px;
  border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap;
}
.ovw-sev svg { width: 14px; height: 14px; flex: 0 0 auto; }
.ovw-sev[data-sev='high'] { background: var(--danger-soft); color: var(--ink-coral); }
.ovw-sev[data-sev='medium'] { background: var(--warn-soft); color: var(--ink-amber); }
.ovw-sev[data-sev='low'] { background: var(--info-soft); color: var(--text-2); }
.ovw-need-title { font-weight: 800; font-size: 14px; line-height: 1.3; }
.ovw-need-fix { color: var(--text-2); font-size: 13px; line-height: 1.35; }
.ovw-more-btn { align-self: flex-start; margin-top: auto; min-height: 44px; padding: 0; border: 0; background: none; font-size: 13px; font-weight: 800; color: var(--ink-teal); text-decoration: underline; text-underline-offset: 3px; }
.ovw-need-list[hidden] { display: none; }
.ovw-btn--review { min-height: 44px; }
@media (pointer: fine) { .ovw-btn--review { min-height: 40px; } }
.ovw-split > .ovw-needs { grid-area: needs; }
.ovw-split > .ovw-route { grid-area: route; }
.ovw-split > .ovw-stats { grid-area: stats; }

/* 4. Route card: schematic SVG map, day bands, stop list for small screens */
.ovw-route { display: flex; flex-direction: column; gap: var(--space-4); }
.ovw-route .ovw-head { margin-bottom: 0; }
.ovw-map { border-radius: var(--radius-sm); background: var(--yf-mist); border: 1px solid var(--yf-border); overflow: hidden; }
.ovw-map svg { display: block; width: 100%; height: auto; }
.rm-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; opacity: .8; }
.rm-base { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
/* Each leg is its own path. pathLength 1 lets one dash value draw every leg in. The draw-in runs once, one leg after another. */
.rm-leghit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
.rm-leg { fill: none; stroke: var(--yf-teal-600); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-width var(--motion-fast) var(--ease-out); animation: rmDraw var(--motion-slow) var(--ease-out) backwards; animation-delay: calc(var(--stagger-step) * var(--i, 0)); }
.rm-legg:hover .rm-leg { stroke-width: 5; }
@keyframes rmDraw { from { stroke-dashoffset: 1; } }
/* Pin: a 28px face over a transparent 44px hit circle. Hover and keyboard focus draw a 2px ring 2px outside the face. */
.rm-pin { cursor: pointer; outline: none; }
.rm-hit { fill: transparent; }
.rm-ring { fill: none; stroke: var(--yf-teal-600); stroke-width: 2; opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out); }
.rm-pin:hover .rm-ring, .rm-pin:focus-visible .rm-ring { opacity: 1; }
.rm-dot { fill: var(--card); stroke: var(--yf-teal-600); stroke-width: 3; }
.is-start .rm-dot { fill: var(--yf-teal-600); stroke: var(--card); }
.is-end .rm-dot { fill: var(--yf-saffron); stroke: var(--card); }
.rm-num { font: 800 11px var(--font-display); text-anchor: middle; dominant-baseline: central; fill: var(--ink-teal); }
.is-start .rm-num { fill: var(--card); }
:root[data-theme='dark'] .is-start .rm-num { fill: var(--yf-cream); }
.is-end .rm-num { fill: var(--btn-accent-fg); }
.rm-name { font: 800 12px var(--font-body); fill: var(--text); paint-order: stroke; stroke: var(--yf-mist); stroke-width: 4px; stroke-linejoin: round; }
.rm-tag { font: 700 12px var(--font-body); fill: var(--text-2); paint-order: stroke; stroke: var(--yf-mist); stroke-width: 3px; }
.rm-leglabel rect { fill: var(--card); stroke: var(--yf-border); stroke-width: 1; }
.rm-leglabel text { font: 700 11px var(--font-body); fill: var(--text-2); text-anchor: middle; dominant-baseline: central; }
.ovw-verdict-act { display: grid; justify-items: end; }
.ovw-sample { font-size: 11px; color: var(--text-3); }
.ovw-route-empty { display: grid; align-content: center; flex: 1; }
.ovw-stoplist { display: block; }
.ovw-stoplist.is-long { max-height: 320px; overflow-y: auto; padding-inline-end: var(--space-2); -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }

  <!-- Header and tab bar: from the P2 mockup, unchanged. -->
  <header class="yf-trip-head">
    <button type="button" class="yf-back">&larr; All trips</button>
    <div class="yf-head-row">
      <span class="yf-thumb" aria-hidden="true">
        <svg viewBox="0 0 96 96" preserveAspectRatio="xMidYMid slice" focusable="false">
          <rect width="96" height="96" fill="var(--yf-mist)"/><circle cx="68" cy="26" r="11" fill="var(--yf-saffron)"/>
          <path d="M0 58 L18 38 L30 50 L48 28 L70 52 L84 42 L96 54 V96 H0Z" fill="var(--yf-purple)"/>
          <path d="M0 70 Q22 54 44 68 T96 62 V96 H0Z" fill="var(--yf-teal-600)"/>
          <path d="M0 82 Q28 70 52 82 T96 78 V96 H0Z" fill="var(--yf-navy)"/>
        </svg>
      </span>
      <div>
        <h1 class="yf-head-title">North South</h1>
        <p class="yf-head-meta">Kolkata, West Bengal &rarr; Leh, Ladakh &middot; 1 Sep &ndash; 10 Sep 2026 &middot; 4 travellers &middot; Motorcycle &middot; Relaxed</p>
      </div>
      <div class="yf-head-actions"><button type="button" class="yf-btn yf-btn--quiet">Invite &amp; share</button></div>
    </div>
    <div class="yf-head-foot">
    <div class="yf-act-extra"><button type="button" class="yf-btn yf-btn--quiet">Invite &amp; share</button></div>
    <div class="yf-members" aria-label="Members">
      <span class="yf-avatars"><span class="avatar">A</span><span class="avatar">B</span><span class="avatar">C</span></span>
      <span class="yf-member-note"><b>3 members</b> &middot; you are owner</span>
    </div>
    </div>
  </header>
  <div class="yf-tabbar" role="tablist" aria-label="Trip sections">
    <button class="yf-tab" role="tab" aria-selected="true">Overview</button>
    <button class="yf-tab" role="tab" aria-selected="false">Board</button>
    <button class="yf-tab" role="tab" aria-selected="false">Map</button>
    <button class="yf-tab" role="tab" aria-selected="false">Timeline</button>
    <button class="yf-tab" role="tab" aria-selected="false">Group input<span class="yf-count">3</span></button>
    <button class="yf-tab" role="tab" aria-selected="false">Budget</button>
    <button class="yf-tab" role="tab" aria-selected="false">Share</button>
    <button class="yf-tab" role="tab" aria-selected="false">Settings</button>
  </div>

  <div id="note"></div>
  <div id="toast" class="mock-toast" role="status" aria-live="polite"></div>
  <main class="ovw" id="ovw" role="tabpanel" aria-label="Overview"></main>
</div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var root = document.documentElement;
  var STATES = ['ready', 'loading', 'failed', 'empty', 'kept'];
  var NS = 'http://www.w3.org/2000/svg';
  /* Sample-size knobs for the review shots: ?days=N sets the day count, ?stops=N sets the route points. */
  var DAYS = Math.max(1, Math.min(30, parseInt(qs.get('days'), 10) || 10));
  var NPTS = qs.has('stops') ? Math.max(0, Math.min(30, parseInt(qs.get('stops'), 10) || 0)) : 6;
  var STOPCOUNT = qs.has('stops') ? NPTS : 14;
  var alertUsed = false;

  /* ---------- inline icons (decorative) ---------- */
  function ic(d, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var I = {
    high: ic('<path d="M12 3v9"/><circle cx="12" cy="18" r="1.6"/>', 2.4),
    medium: ic('<path d="M12 3 2.5 20h19z"/><path d="M12 10v5"/>', 2.2),
    warn: ic('<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/>'),
    check: ic('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>', 2.2),
    pin: ic('<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    sun: ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    rain: ic(
      '<path d="M7 15a4.5 4.5 0 1 1 1.2-8.8A5.5 ' +
      '5.5 0 0 1 18.8 8 3.5 3.5 ' +
      '0 0 1 18 15"/><path d="M9 18l-1 3M13 ' +
      '18l-1 3M17 18l-1 3"/>'),
    breakfast: ic(
      '<path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 ' +
      '5 0 0 1-5-5V8z"/><path d="M16 10h2a2 2 0 ' +
      '0 1 0 4h-2M8 3v2M12 3v2"/>'),
    meal: ic(
      '<path d="M6 3v7a2 2 0 0 0 4 ' +
      '0V3M8 3v18M17 3c-2 2-3 4-3 7 0 1.5 ' +
      '1 2 3 2V3zM17 12v9"/>'),
    fuel: ic(
      '<path d="M5 21V5a2 2 0 0 1 2-2h6a2 ' +
      '2 0 0 1 2 2v16M3 21h14M8 8h4M15 ' +
      '10h2a2 2 0 0 1 2 2v4a1.5 1.5 ' +
      '0 0 0 3 0V9l-3-3"/>'),
    stretch: ic('<circle cx="12" cy="5" r="2"/><path d="M12 8v6M8 21l4-7 4 7M7 11l5-3 5 3"/>'),
    night: ic('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>')
  };
  I.low = ic('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>', 2.2);

  /* ---------- StateBlock, compact. Only the first failed block is an alert; the rest are status. ---------- */
  function state(kind, o) {
    var role = '';
    if (kind === 'failed') { role = alertUsed ? ' role="status"' : ' role="alert"'; alertUsed = true; }
    else if (kind === 'loading' || kind === 'kept') role = ' role="status"';
    var icon = o.icon ? '<div class="yf-state-icon">' + o.icon + '</div>' : '';
    return '<div class="yf-state' + (kind === 'kept' ? ' yf-state--kept' : '') + '" data-kind="' + kind + '"' + role + '>' + icon +
      '<h3 class="yf-state-title">' + o.title + '</h3>' + (o.body ? '<p class="yf-state-body">' + o.body + '</p>' : '') +
      (o.actions ? '<div class="yf-state-actions">' + o.actions + '</div>' : '') + '</div>';
  }
  var spin = '<span class="spinner" aria-hidden="true"></span>';
  var retry = '<button type="button" class="ovw-btn">Try again</button>';

  /* ---------- sample data (labelled sample; engine logic is not touched) ---------- */
  var WARN = [
    { sev: 'high', lead: 'High', title: 'Day 3 drives 11 h 40 min', fix: 'Move one stop to Day 4, or add a rest stop before Kargil.', act: 'Fix Day 3' },
    { sev: 'medium', lead: 'Medium', title: 'Day 6 arrives after sunset', fix: 'Leave 1 h earlier, or shorten the lunch break.', act: 'Fix Day 6' },
    { sev: 'low', lead: 'Low', title: 'Day 8 has no fuel stop planned', fix: 'Add a fuel stop before the long climb.', act: 'Fix Day 8' },
    { sev: 'low', lead: 'Low', title: 'Day 9 has a short lunch break', fix: 'Add 20 minutes so the stop is not rushed.', act: 'Fix Day 9' },
    { sev: 'low', lead: 'Low', title: 'Day 2 has no rest stop planned', fix: 'Add a stretch break after the climb.', act: 'Fix Day 2' }
  ];
  function needRow(w) {
    return '<li class="ovw-need"><span class="ovw-sev" data-sev="' + w.sev + '">' + I[w.sev] + w.lead + '</span>' +
      '<div class="ovw-need-text"><div class="ovw-need-title">' + w.title + '</div><div class="ovw-need-fix">' + w.fix + '</div></div>' +
      '<button type="button" class="ovw-btn ovw-btn--review">' + w.act + '</button></li>';
  }

  function verdict(s) {
    var empty = s === 'empty';
    var band = empty ? 'teal' : 'saffron', name = empty ? 'Not scored yet' : 'Tight', score = empty ? '–' : '58';
    var line = empty ? 'Nothing is planned yet.' : 'The days run long. Expect late arrivals.';
    var sub = empty ? 'Add a stop and the plan gets a score.' : WARN.length + ' issues in ' + DAYS + ' days. First: ' + WARN[0].title + '.';
    var btn = empty ? 'Open Timeline' : 'Fix ' + WARN.length + ' issues';
    var bar = empty ? '' : '<div class="ovw-bar" role="img" aria-label="Trip health 58 of 100"><i style="width:58%"></i></div>';
    return '<section class="ovw-card ovw-verdict" data-band="' + band + '" aria-labelledby="v-h">' +
      '<div class="ovw-score"><span class="ovw-score-num">' + score + '</span><span class="ovw-score-of">' + (empty ? 'no score' : 'of 100') + '</span><span class="ovw-band">' + name + '</span></div>' +
      '<div class="ovw-verdict-text"><h2 class="ovw-verdict-line" id="v-h">' + line + '</h2><p class="ovw-verdict-sub">' + sub + '</p>' + bar + '</div>' +
      '<div class="ovw-verdict-act"><button type="button" class="ovw-btn ovw-btn--primary">' + btn + '</button></div></section>';
  }

  function needs(s) {
    if (s === 'empty') {
      return '<section class="ovw-card ovw-needs" aria-labelledby="n-h"><div class="ovw-head"><h2 class="ovw-title" id="n-h">What needs you</h2></div>' +
        state('empty', { icon: I.check, title: 'Nothing to check yet', body: 'Issues appear after you add a stop.' }) + '</section>';
    }
    var rows = WARN.slice(0, 3).map(needRow).join('');
    var more = WARN.slice(3).map(needRow).join('');
    return '<section class="ovw-card ovw-needs" aria-labelledby="n-h"><div class="ovw-head"><h2 class="ovw-title" id="n-h">What needs you</h2>' +
      '<span class="ovw-count">' + WARN.length + ' warnings</span></div><ul class="ovw-need-list">' + rows + '</ul>' +
      '<ul class="ovw-need-list" id="moreRows" hidden>' + more + '</ul>' +
      '<button type="button" class="ovw-more-btn" id="moreBtn" aria-expanded="false" aria-controls="moreRows">' + (WARN.length - 3) + ' more warnings</button></section>';
  }

  function stats(s) {
    var e = s === 'empty';
    return '<section class="ovw-stats" aria-label="Trip totals">' +
      '<div class="ovw-card ovw-stat"><span class="ovw-stat-label">Total cost</span><span class="ovw-stat-val">' + (e ? '–' : '&#8377;1,84,500') + '</span><span class="ovw-stat-sub">' + (e ? 'Shows after you add a cost' : '&#8377;18,450 a day, estimate') + '</span></div>' +
      '<div class="ovw-card ovw-stat"><span class="ovw-stat-label">Per person</span><span class="ovw-stat-val">' + (e ? '–' : '&#8377;46,125') + '</span><span class="ovw-stat-sub">' + (e ? 'Shows after you add a cost' : 'against a &#8377;50,000 target') + '</span></div>' +
      '<div class="ovw-card ovw-stat"><span class="ovw-stat-label">Travel effort</span><span class="ovw-stat-val">' + (e ? '–' : '38 h 20 min') + '</span><span class="ovw-stat-sub">' + (e ? 'Shows after you add a stop' : '4 overnight bases') + '</span></div></section>';
  }

  /* ---------- route map ----------
     Real data (OverviewTab.tsx): overviewRoutePoints gives the ordered points.
     road.legs gives distanceKm and durationMinutes for each leg after the road is measured.
     Pins show the start, each overnight base and the end. The header counts every stop.
     The numbers below are sample numbers. */
  var COLS = ['var(--yf-saffron)', 'var(--yf-purple)', 'var(--ok)', 'var(--text-3)', 'var(--yf-teal-600)'];
  var NAMES = ['Kolkata', 'Siliguri', 'Gangtok', 'Chandigarh', 'Manali', 'Leh'];
  var NAMES14 = ['Kolkata', 'Siliguri', 'Gangtok', 'Pelling', 'Darjeeling', 'Kalimpong', 'Chandigarh', 'Ambala', 'Shimla', 'Manali', 'Kaza (Spiti Valley)', 'Keylong', 'Sarchu', 'Leh'];
  var DEF_LEGS = [['570 km', '11 h 30', 'Days 1–2'], ['115 km', '4 h', 'Day 3'], ['670 km', '9 h 20', 'Days 4–6'], ['310 km', '5 h', 'Days 7–8'], ['475 km', '8 h 30', 'Days 9–10']];
  var YS = [108, 62, 100, 54, 96, 50];
  var W = 720, H = 170, MX0 = 44, PILL_W = 84, PILL_H = 46, PIN_R = 14, HIT_R = 22;
  function hm(min) { var h = Math.floor(min / 60), m = min % 60; return h + ' h' + (m ? ' ' + m : ''); }
  function routeData(n) {
    var names = n === 6 && !qs.has('stops') ? NAMES : NAMES14.slice(0, n);
    while (names.length < n) names.push('Stop ' + (names.length + 1));
    var pts = names.map(function (nm, i) {
      return { n: nm, x: n === 1 ? W / 2 : MX0 + i * (W - 2 * MX0) / (n - 1), y: n === 1 ? 84 : YS[i % 6] };
    });
    var legs = [], total = 0;
    for (var i = 0; i < n - 1; i++) {
      var L;
      if (n === 6 && !qs.has('stops')) { L = DEF_LEGS[i]; L = { km: L[0], t: L[1], d: L[2], c: COLS[i % 5] }; total += parseInt(L.km, 10); }
      else {
        var km = 90 + ((i * 131) % 380), a = Math.floor(i * DAYS / (n - 1)) + 1, b = Math.max(a, Math.floor((i + 1) * DAYS / (n - 1)));
        total += km; L = { km: km + ' km', t: hm(Math.round(km * 1.15)), d: a === b ? 'Day ' + a : 'Days ' + a + '–' + b, c: COLS[i % 5] };
      }
      var dm = L.d.match(/(\d+)(?:–(\d+))?/);
      L.a = +dm[1]; L.b = +(dm[2] || dm[1]);
      legs.push(L);
    }
    /* A pin's day is the day the leg before it ends. The start pin is Day 1. */
    pts.forEach(function (p, i) { p.day = i === 0 ? 1 : legs[i - 1].b; });
    return { pts: pts, legs: legs, total: total };
  }
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function overlap(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function cut(nm, max) { return nm.length > max ? nm.slice(0, max - 1) + '…' : nm; }
  function buildMap(R) {
    var P = R.pts, n = P.length, spacing = n > 1 ? (W - 2 * MX0) / (n - 1) : W;
    var showPills = n > 1 && spacing >= PILL_W + 2 * PIN_R;
    /* The pins are buttons, so the map is a labelled group. The drawing around them is decoration. */
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': 'Route map. Each pin opens the Map at that stop.', focusable: 'false' });
    var deco = function (e) { e.setAttribute('aria-hidden', 'true'); return e; };
    [44, 88, 132].forEach(function (y) { svg.appendChild(deco(el('line', { class: 'rm-grid', x1: 8, x2: W - 8, y1: y, y2: y }))); });
    var placed = [];
    P.forEach(function (p) { placed.push({ x: p.x - 19, y: p.y - 19, w: 38, h: 38 }); });
    if (n > 1) {
      var d = 'M' + P[0].x + ' ' + P[0].y, mids = [], segs = [];
      for (var i = 1; i < n; i++) {
        var a = P[i - 1], b = P[i], mx = (a.x + b.x) / 2;
        var seg = ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y;
        d += seg; segs.push('M' + a.x + ' ' + a.y + seg);
        mids.push({ x: mx, y: (a.y + b.y) / 2 });
      }
      svg.appendChild(deco(el('path', { class: 'rm-base', d: d })));
      /* One path for each leg. A hover on a leg thickens it. The draw-in delay grows by one stagger step for each leg, up to eight. */
      var lgs = [];
      segs.forEach(function (sd, i) {
        var lg = deco(el('g', { class: 'rm-legg' })); lgs.push(lg);
        lg.appendChild(el('path', { class: 'rm-leghit', d: sd }));
        lg.appendChild(el('path', { class: 'rm-leg', d: sd, pathLength: '1', style: '--i:' + Math.min(i, 8) }));
        svg.appendChild(lg);
      });
      /* leg pills sit on the line: distance, drive time, day range and a day-colour stripe. They hide when pins sit too close. */
      if (showPills) mids.forEach(function (m, i) {
        var L = R.legs[i], g = deco(el('g', { class: 'rm-leglabel' }));
        g.appendChild(el('rect', { x: m.x - PILL_W / 2, y: m.y - PILL_H / 2, width: PILL_W, height: PILL_H, rx: 8 }));
        g.appendChild(el('rect', { x: m.x - PILL_W / 2 + 10, y: m.y + PILL_H / 2 - 5, width: PILL_W - 20, height: 3, rx: 1.5, style: 'fill:' + L.c + ';stroke:none' }));
        g.appendChild(el('text', { x: m.x, y: m.y - 14, style: 'font-weight:800' }, L.km));
        g.appendChild(el('text', { x: m.x, y: m.y - 2 }, L.t));
        g.appendChild(el('text', { x: m.x, y: m.y + 10, style: 'font-weight:600' }, L.d));
        lgs[i].appendChild(g);
        placed.push({ x: m.x - PILL_W / 2 - 2, y: m.y - PILL_H / 2 - 2, w: PILL_W + 4, h: PILL_H + 4 });
      });
    }
    /* stop labels: names stop at 14 characters. Try the preferred side, then the others. A name that fits nowhere
       drops to 8 characters, then to no label. The pin keeps the full name in its title. */
    P.forEach(function (p, i) {
      var tag = n > 1 && i === 0 ? 'Start' : n > 1 && i === n - 1 ? 'End' : '';
      var nb = [P[i - 1], P[i + 1]].filter(Boolean), avg = nb.length ? nb.reduce(function (s, q) { return s + q.y; }, 0) / nb.length : p.y + 1;
      var peak = p.y < avg, done = false;
      [14, 8].forEach(function (max) {
        if (done) return;
        var txt = cut(p.n, max), w = Math.ceil(txt.length * 6.8) + 4, h = tag ? 26 : 14;
        var below = { x: p.x - w / 2, y: p.y + 21, a: 'middle', cx: p.x }, above = { x: p.x - w / 2, y: p.y - 21 - h, a: 'middle', cx: p.x };
        var cand = [peak ? above : below, peak ? below : above,
          { x: p.x + 22, y: p.y - h / 2, a: 'start', cx: p.x + 22 }, { x: p.x - 22 - w, y: p.y - h / 2, a: 'end', cx: p.x - 22 }];
        for (var k = 0; k < cand.length && !done; k++) {
          var c = cand[k];
          if (c.a === 'middle') { var nx = Math.min(Math.max(c.x, 6), W - 6 - w); c.cx += nx - c.x; c.x = nx; }
          var r = { x: c.x, y: c.y, w: w, h: h };
          if (r.x < 4 || r.x + r.w > W - 4 || r.y < 2 || r.y + r.h > H - 2) continue;
          if (placed.some(function (q) { return overlap(r, q); })) continue;
          placed.push(r); done = true;
          var g = deco(el('g', {})), ty = r.y + 11;
          g.appendChild(el('text', { class: 'rm-name', x: c.cx, y: ty, 'text-anchor': c.a }, txt));
          if (tag) g.appendChild(el('text', { class: 'rm-tag', x: c.cx, y: ty + 12, 'text-anchor': c.a }, tag));
          svg.appendChild(g);
        }
      });
    });
    /* Pins draw last so they sit above the labels. Each pin is a button: a 44px transparent hit circle, a 28px face and a ring. */
    P.forEach(function (p, i) {
      var role = i === 0 ? 'is-start' : (i === n - 1 && n > 1 ? 'is-end' : '');
      var L = i > 0 ? R.legs[i - 1] : null;
      var label = 'Stop ' + (i + 1) + ' of ' + n + ', ' + p.n + ', Day ' + p.day + (L ? '. ' + L.km + ', ' + L.t + ' from stop ' + i : '') + '. Opens the Map at this stop.';
      var g = el('g', { class: 'rm-pin ' + role, role: 'button', tabindex: '0', 'aria-label': label, 'data-open': 'Map at ' + p.n });
      g.appendChild(el('title', {}, p.n + ', Day ' + p.day));
      g.appendChild(el('circle', { class: 'rm-hit', cx: p.x, cy: p.y, r: HIT_R }));
      g.appendChild(el('circle', { class: 'rm-ring', cx: p.x, cy: p.y, r: PIN_R + 4.5 }));
      g.appendChild(el('circle', { class: 'rm-dot', cx: p.x, cy: p.y, r: PIN_R }));
      g.appendChild(el('text', { class: 'rm-num', x: p.x, y: p.y + 0.5, 'aria-hidden': 'true' }, String(i + 1)));
      svg.appendChild(g);
    });
    return svg;
  }
  function stopList(R, long) {
    var P = R.pts, n = P.length;
    var out = '<ol class="ovw-stoplist' + (long ? ' is-long' : '') + '" aria-label="Route: ' + STOPCOUNT + (STOPCOUNT === 1 ? ' stop' : ' stops') + ', ' + R.total.toLocaleString('en-IN') + ' km"' + (long ? ' tabindex="0"' : '') + '>';
    P.forEach(function (p, i) {
      var role = i === 0 ? 'is-start' : (i === n - 1 && n > 1 ? 'is-end' : '');
      var tag = n > 1 && i === 0 ? '<small>Start</small>' : (n > 1 && i === n - 1 ? '<small>End</small>' : '');
      out += '<li class="' + role + '"><button type="button" class="ovw-stop-btn" data-open="Map at ' + p.n + '" aria-label="Stop ' + (i + 1) + ', ' + p.n + ', Day ' + p.day + '. Opens the Map at this stop.">' +
        '<span class="ovw-stop-pin" aria-hidden="true">' + (i + 1) + '</span><span class="ovw-stop-name">' + p.n + tag + '</span></button></li>';
      if (i < R.legs.length) {
        var L = R.legs[i];
        out += '<li class="is-leg" style="--c:' + L.c + '"><span class="ovw-leg-text"><b>' + L.km + '</b><span>' + L.t + '</span><i>' + L.d + '</i></span></li>';
      }
    });
    return out + '</ol>';
  }

  function route(s) {
    var open = '<button type="button" class="ovw-link" data-open="Map">Open map</button>';
    if (s === 'empty' || NPTS === 0) {
      return '<section class="ovw-card ovw-route" aria-labelledby="r-h"><div class="ovw-head"><h2 class="ovw-title" id="r-h">Route</h2></div><div class="ovw-route-empty">' +
        state('empty', { icon: I.pin, title: 'No route to draw yet', body: 'This plan needs at least two places with confirmed coordinates. Add a stop, or pin the missing ones.' }) + '</div></section>';
    }
    var R = routeData(NPTS), asList = NPTS > 8;
    return '<section class="ovw-card ovw-route" data-view="' + (asList ? 'list' : 'map') + '" aria-labelledby="r-h"><div class="ovw-head"><h2 class="ovw-title" id="r-h">Route</h2>' +
      '<div class="ovw-head-meta"><span><b>' + DAYS + '</b> ' + (DAYS === 1 ? 'day' : 'days') + '</span>' + (R.total ? '<span><b>' + R.total.toLocaleString('en-IN') + '</b> km</span>' : '') + '<span><b>' + STOPCOUNT + '</b> ' + (STOPCOUNT === 1 ? 'stop' : 'stops') + '</span>' + open + '</div></div>' +
      (asList ? '' : '<div class="ovw-map" id="rmap"></div>') + stopList(R, asList) +
      '<p class="ovw-sample">Sample route, schematic and not to scale. Pins show the start, the overnight bases and the end.</p></section>';
  }

  /* ---------- day matrix ---------- */
  var KINDS = [
    { key: 'breakfast', name: 'Breakfast', ic: 'breakfast', k: 'var(--ink-amber)' },
    { key: 'lunch', name: 'Lunch', ic: 'meal', k: 'var(--ink-green)' },
    { key: 'fuel', name: 'Fuel', ic: 'fuel', k: 'var(--yf-purple)' },
    { key: 'stretch', name: 'Stretch', ic: 'stretch', k: 'var(--ink-teal)' },
    { key: 'dinner', name: 'Dinner', ic: 'meal', k: 'var(--ink-amber)' },
    { key: 'stay', name: 'Night', ic: 'night', k: 'var(--text-2)' }
  ];
  /* f = planned (stop title), a = added by the app, e = still open, n = not part of this day */
  var MX = [
    ['n', ['f', 'Barasat'], 'a', 'e', ['f', 'Hotel'], ['f', 'Siliguri']],
    [['f', 'Buffet'], 'e', ['f', 'HP, Mirik'], 'a', ['f', 'Thali'], ['f', 'Siliguri']],
    ['e', ['f', 'Momo stop'], 'e', 'e', 'e', ['f', 'Gangtok']],
    [['f', 'Rumtek'], ['f', 'Singtam'], ['f', 'IOC pump'], 'a', ['f', 'Rooftop'], ['f', 'Gangtok']],
    [['f', 'Buffet'], 'e', 'a', 'e', ['f', 'Thali'], ['f', 'Ambala']],
    [['f', 'Karnal'], ['f', 'Ambala'], 'e', 'a', ['f', 'Hotel'], ['f', 'Chandigarh']],
    [['f', 'Buffet'], 'a', ['f', 'HP, Mandi'], 'e', ['f', 'Riverside'], ['f', 'Manali']],
    [['f', 'Manali'], ['f', 'Keylong'], 'a', 'a', 'e', ['f', 'Jispa camp']],
    [['f', 'Camp'], ['f', 'Pang tea'], ['f', 'Sarchu'], 'e', ['f', 'Leh'], ['f', 'Leh']],
    [['f', 'Buffet'], 'e', 'n', 'n', 'n', 'n']
  ];
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dateOf(i) { var d = new Date(2026, 8, 1 + i); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
  var TODAY = Math.min(3, DAYS - 1);
  function matrixRows() {
    var out = [];
    for (var di = 0; di < DAYS; di++) {
      var cells = MX[di % MX.length], filled = 0, total = 0;
      var cs = cells.map(function (c, ki) {
        var k = KINDS[ki], st = typeof c === 'string' ? c : c[0], title = typeof c === 'string' ? '' : c[1];
        if (st === 'n') return { st: 'n', k: k, html: '<div class="mx-cell" role="gridcell" data-state="none" style="--k:' + k.k + '" aria-label="Day ' + (di + 1) + ' ' + k.name + ': not part of this day"><span class="mx-btn"><span class="mx-chip" aria-hidden="true">&ndash;</span></span></div>', g: '<span class="mx-g" data-state="none" style="--k:' + k.k + '" aria-hidden="true">&ndash;</span>' };
        total++; if (st === 'f') filled++;
        /* The auto chip reads "Auto" on one line. The full words sit in the title and the label. */
        var full = st === 'f' ? title : st === 'a' ? 'Auto-added by the app' : 'Open';
        var aria = 'Day ' + (di + 1) + ' ' + k.name + ': ' + (st === 'f' ? title : st === 'a' ? 'Auto-added by the app' : 'still open') + '. Opens the Timeline at this slot.';
        var inner = st === 'e' ? '<span>Open</span>' : I[k.ic] + '<span>' + (st === 'a' ? 'Auto' : title) + '</span>';
        var name = { f: 'filled', a: 'auto', e: 'empty' }[st];
        return { st: st, k: k, title: title, html: '<div class="mx-cell" role="gridcell" data-state="' + name + '" style="--k:' + k.k + '"><button type="button" class="mx-btn" tabindex="-1" data-open="Timeline at Day ' + (di + 1) + ', ' + k.name + '" title="' + k.name + ': ' + full + '" aria-label="' + aria + '"><span class="mx-chip">' + inner + '</span></button></div>',
          g: '<span class="mx-g" data-state="' + name + '" style="--k:' + k.k + '" aria-hidden="true">' + (st === 'e' ? '' : I[k.ic]) + '</span>' };
      });
      out.push({ di: di, filled: filled, total: total, cs: cs, html: cs.map(function (c) { return c.html; }).join('') });
    }
    return out;
  }
  function compactRow(r) {
    var today = r.di === TODAY, lists = { f: [], a: [], e: [], n: [] };
    r.cs.forEach(function (c) { lists[c.st].push(c.k.name.toLowerCase()); });
    var aria = 'Day ' + (r.di + 1) + ', ' + dateOf(r.di) + (today ? ', today' : '') + '. ' + r.filled + ' of ' + r.total + ' planned.' +
      (lists.f.length ? ' Planned: ' + lists.f.join(', ') + '.' : '') + (lists.a.length ? ' Added by the app: ' + lists.a.join(', ') + '.' : '') +
      (lists.e.length ? ' Still open: ' + lists.e.join(', ') + '.' : '') + (lists.n.length ? ' Not part of this day: ' + lists.n.join(', ') + '.' : '') + ' Opens the Timeline at this day.';
    return '<li><button type="button" class="mx-crow' + (today ? ' is-today' : '') + '" data-open="Timeline at Day ' + (r.di + 1) + '" aria-label="' + aria + '"><span class="mx-cday"><b>Day ' + (r.di + 1) + (today ? '<span class="mx-today">Today</span>' : '') + '</b><small>' + dateOf(r.di) + '</small></span>' +
      r.cs.map(function (c) { return c.g; }).join('') + '<span class="mx-ctot">' + r.filled + '/' + r.total + '</span></button></li>';
  }
  function matrix(s) {
    var head = '<section class="ovw-block" aria-labelledby="m-h"><div class="ovw-head"><h2 class="ovw-title" id="m-h">What each day holds</h2>';
    if (s === 'empty') return head + '</div>' + state('empty', { title: 'Nothing planned yet', body: 'Add a stop and each day shows its meals, fuel, stretch breaks and night.' }) + '</section>';
    var rows = matrixRows();
    var ratio = function (r) { return r.total ? r.filled / r.total : 1; };
    var thin = rows.slice().sort(function (a, b) { return ratio(a) - ratio(b); })[0];
    var tie = rows.every(function (r) { return ratio(r) === ratio(rows[0]); });
    var showThin = rows.length > 1 && !tie;
    var thinTxt = showThin ? '<span class="ovw-item">Thinnest: <b>Day ' + (thin.di + 1) + ', ' + thin.filled + ' of ' + thin.total + '</b></span>' : '';
    var heads = KINDS.map(function (k) { return '<div class="mx-th" role="columnheader" style="--k:' + k.k + '">' + I[k.ic] + k.name + '</div>'; }).join('');
    var body = rows.map(function (r) {
      var today = r.di === TODAY, isThin = showThin && r === thin;
      return '<div class="mx-row' + (today ? ' is-today' : '') + '" role="row"><div class="mx-daycol mx-day" role="rowheader"><button type="button" tabindex="-1" data-open="Timeline at Day ' + (r.di + 1) + '" aria-label="Day ' + (r.di + 1) + ', ' + dateOf(r.di) + (today ? ', today' : '') + '. Opens the Timeline at this day."><span>Day ' + (r.di + 1) + (today ? '<span class="mx-today">Today</span>' : '') + '</span><small>' + dateOf(r.di) + '</small></button></div>' +
        r.html + '<div class="mx-total' + (isThin ? ' is-thin' : '') + '" role="gridcell" aria-label="' + r.filled + ' of ' + r.total + ' planned' + (isThin ? '. Thin day.' : '') + '"><span>' + r.filled + '/' + r.total + (isThin ? ' <em>Thin</em>' : '') + '</span>' +
        '<i class="mx-bar" aria-hidden="true"><b style="width:' + (r.total ? Math.round(r.filled / r.total * 100) : 0) + '%"></b></i></div></div>';
    }).join('');
    var key = '<span class="mx-key"><span><i class="k-f"></i>Planned</span><span><i class="k-a"></i>Auto-added</span><span><i class="k-e"></i>Open</span></span>';
    var chead = '<li class="mx-chead" aria-hidden="true"><span>Day</span>' + KINDS.map(function (k) { return '<span style="--k:' + k.k + '" title="' + k.name + '">' + I[k.ic] + '</span>'; }).join('') + '<span>n/6</span></li>';
    return head + '<div class="ovw-head-meta">' + thinTxt + key + '</div></div>' +
      '<div class="mx-wrap" id="mxwrap"><div class="mx-scroll" id="mxscroll"><div class="mx" role="grid" id="mxgrid" aria-label="Planned parts per day. Use the arrow keys to move between cells.">' +
      '<div class="mx-row is-head" role="row"><div class="mx-th mx-daycol" role="columnheader">Day</div>' + heads + '<div class="mx-th" role="columnheader" style="justify-content:center">Filled</div></div>' + body + '</div></div><div class="mx-fade" aria-hidden="true"></div></div>' +
      '<ul class="mx-compact" aria-label="Planned parts per day">' + chead + rows.map(compactRow).join('') + '</ul></section>';
  }
  function wireMatrix() {
    var grid = document.getElementById('mxgrid'); if (!grid) return;
    var scroll = document.getElementById('mxscroll'), wrap = document.getElementById('mxwrap');
    function fade() { wrap.classList.toggle('can-scroll', scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth - 2); }
    scroll.addEventListener('scroll', fade); window.addEventListener('resize', fade); fade();
    var rowEls = Array.prototype.slice.call(grid.querySelectorAll('[role=row]'));
    var rows = rowEls.map(function (r) { return Array.prototype.slice.call(r.querySelectorAll('[role=rowheader] button, [role=gridcell] button')); }).filter(function (r) { return r.length; });
    function colOf(btn) { var cell = btn.closest('[role=gridcell],[role=rowheader]'); return Array.prototype.indexOf.call(cell.parentNode.children, cell); }
    function at(r, c) { var row = rows[r]; if (!row) return null; for (var i = 0; i < row.length; i++) if (colOf(row[i]) === c) return row[i]; return null; }
    var start = 0; rows.forEach(function (row, i) { if (row[0].closest('[role=row]').classList.contains('is-today')) start = i; });
    var cur = rows[start][0]; cur.tabIndex = 0;
    function go(btn) { if (!btn) return; cur.tabIndex = -1; cur = btn; cur.tabIndex = 0; cur.focus(); }
    grid.addEventListener('focusin', function (e) { var b = e.target.closest('button'); if (b && b !== cur) { cur.tabIndex = -1; cur = b; b.tabIndex = 0; } });
    grid.addEventListener('keydown', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var r = 0, c = colOf(b); rows.forEach(function (row, i) { if (row.indexOf(b) >= 0) r = i; });
      var d = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] }[e.key];
      if (d) { e.preventDefault(); var rr = r + d[0], cc = c + d[1], t = null; while (!t && rr >= 0 && rr < rows.length && cc >= 0 && cc <= 6) { t = at(rr, cc); rr += d[0]; cc += d[1]; } go(t); }
      else if (e.key === 'Home') { e.preventDefault(); go(rows[r][0]); }
      else if (e.key === 'End') { e.preventDefault(); go(rows[r][rows[r].length - 1]); }
    });
  }

  /* ---------- small data blocks ---------- */
  function pulse(s) {
    var dec;
    if (s === 'loading') dec = state('loading', { icon: spin, title: 'Loading decisions' });
    else if (s === 'failed') dec = state('failed', { icon: I.warn, title: 'Couldn’t load decisions', body: 'The request failed. It does not mean there are no open decisions.', actions: retry });
    else if (s === 'empty') dec = state('empty', { title: 'No open decisions', body: 'Nothing is waiting for a vote.' });
    else dec = (s === 'kept' ? state('kept', { icon: I.warn, title: 'Couldn’t refresh decisions', body: 'Showing the decisions that were loaded.', actions: retry }) : '') +
      '<div class="ovw-pulse-row"><span><b>2</b> open decisions</span><button type="button" class="ovw-btn ovw-btn--quiet">Review decisions</button></div>';
    return '<section class="ovw-block" aria-labelledby="p-h"><div class="ovw-head"><h2 class="ovw-title" id="p-h">Group pulse</h2><button type="button" class="ovw-btn ovw-btn--quiet ovw-head-btn">Invite travellers</button></div>' +
      '<div class="ovw-pulse-row"><span><b>3</b> members</span><span class="yf-avatars"><span class="avatar">A</span><span class="avatar">B</span><span class="avatar">C</span></span></div>' + dec + '</section>';
  }

  function commitments(s) {
    var body;
    if (s === 'empty') body = state('empty', { title: 'No fixed commitments yet', body: 'Add check-ins, trains or flights so the planner can protect them.' });
    else body = '<div class="ovw-next">' + I.pin + '<div><b>Next: Hotel check-in, Gangtok</b><span>Day 4 at 2:00 pm</span></div></div>' +
      '<div class="ovw-commit"><span><b>Train to Siliguri</b> <span class="ovw-commit-when">Day 1, 9:15 pm</span></span><span class="ovw-chip">Train</span></div>' +
      '<div class="ovw-commit"><span><b>Flight from Leh</b> <span class="ovw-commit-when">Day 10, 6:40 am</span></span><span class="ovw-chip">Flight</span></div>';
    return '<section class="ovw-block" aria-labelledby="c-h"><div class="ovw-head"><h2 class="ovw-title" id="c-h">Fixed commitments</h2>' +
      '<span class="ovw-chip">' + (s === 'empty' ? 0 : 3) + '</span></div>' + body + '</section>';
  }

  function activity(s) {
    var body, rows = '<ul class="ovw-feed"><li><span class="avatar">A</span><span><b>Sample member A</b> moved a stop to Day 4</span><time>2 h ago</time></li>' +
      '<li><span class="avatar">B</span><span><b>Sample member B</b> voted on a stay</span><time>5 h ago</time></li>' +
      '<li><span class="avatar">C</span><span><b>Sample member C</b> added a fuel stop</span><time>1 d ago</time></li></ul>';
    if (s === 'loading') body = state('loading', { icon: spin, title: 'Loading activity' });
    else if (s === 'failed') body = state('failed', { icon: I.warn, title: 'Couldn’t load activity', body: 'The request failed. It does not mean there is no activity.', actions: retry });
    else if (s === 'empty') body = state('empty', { title: 'No recent activity yet', body: 'Updates from your group will appear here.' });
    else if (s === 'kept') body = state('kept', { icon: I.warn, title: 'Couldn’t refresh recent activity', body: 'Showing the activity that was loaded.', actions: retry }) + rows;
    else body = rows;
    return '<section class="ovw-block" aria-labelledby="a-h"><div class="ovw-head"><h2 class="ovw-title" id="a-h">Recent activity</h2></div>' + body + '</section>';
  }

  function weather(s) {
    var cells = [['Day 1', 'sun', '31° / 22°', 'Dry', 0], ['Day 2', 'rain', '27° / 20°', 'Rain 70%', 1], ['Day 3', 'rain', '24° / 18°', 'Rain 50%', 1], ['Day 4', 'sun', '22° / 14°', 'Dry', 0], ['Day 5', 'sun', '19° / 9°', 'Dry', 0]];
    var grid = '<div class="ovw-wx">' + cells.map(function (c) {
      return '<div class="ovw-wx-cell' + (c[4] ? ' wet' : '') + '">' + I[c[1]] + '<span>' + c[0] + '</span><b>' + c[2] + '</b><span>' + c[3] + '</span></div>';
    }).join('') + '</div>';
    var body, meta = '';
    if (s === 'loading') body = state('loading', { icon: spin, title: 'Loading forecast' });
    else if (s === 'failed') body = state('failed', { icon: I.warn, title: 'Couldn’t load the forecast', body: 'The request failed. It does not mean the weather is clear.', actions: retry });
    else if (s === 'empty') body = state('empty', { title: 'No forecast yet', body: 'A forecast appears when a day comes close enough.' });
    else if (s === 'kept') body = state('kept', { icon: I.warn, title: 'Couldn’t refresh the forecast', body: 'Showing the last one.', actions: retry }) + grid;
    else { body = grid; meta = '<div class="ovw-head-meta">Rain is likely on Day 2 and Day 3. Pack rain gear.</div>'; }
    return '<section class="ovw-block ovw-weather" aria-labelledby="w-h"><div class="ovw-head"><h2 class="ovw-title" id="w-h">Weather along the route</h2>' + meta + '</div>' + body + '</section>';
  }

  var notes = {
    ready: 'Ready: every panel has data.',
    loading: 'Loading: weather, group pulse and recent activity wait for a read. The verdict, issues, totals, route, commitments and day matrix come from the plan already on screen, so they stay as they are.',
    failed: 'Failed: three reads failed and each says so with Try again. A failed read never shows as empty.',
    empty: 'Empty: a trip with nothing planned. The score reads a dash, the totals read a dash, and nothing is invented.',
    kept: 'Kept: a refresh failed, so the last loaded rows stay on screen with a note.'
  };

  /* The map shrinks with its card. Below full size the hit circle grows in map units so a pin stays a 44px target.
     It stops at 44 units, because eight pins sit 90 units apart at the least. */
  var pinWatch = null;
  function fitPins(m) {
    if (pinWatch) pinWatch.disconnect();
    if (!window.ResizeObserver) return;
    pinWatch = new ResizeObserver(function () {
      var scale = m.clientWidth / W; if (!scale) return;
      var r = Math.min(44, Math.max(HIT_R, 22 / scale));
      Array.prototype.forEach.call(m.querySelectorAll('.rm-hit'), function (c) { c.setAttribute('r', String(r)); });
    });
    pinWatch.observe(m);
  }
  /* Above 720px the map shows and the stop list is only a text alternative, so it leaves the tab order. */
  var wide = window.matchMedia('(min-width: 721px)');
  function syncList() {
    Array.prototype.forEach.call(document.querySelectorAll('.ovw-route[data-view="map"] .ovw-stoplist'), function (l) { l.inert = wide.matches; });
  }
  wide.addEventListener('change', syncList);

  /* Mockup only: a click shows where the real tab would go. */
  var toastEl = document.getElementById('toast'), toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }
  var ovwEl = document.getElementById('ovw');
  ovwEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open]'); if (t) toast('Would open: ' + t.getAttribute('data-open'));
  });
  ovwEl.addEventListener('keydown', function (e) {
    var p = e.target.closest && e.target.closest('.rm-pin');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toast('Would open: ' + p.getAttribute('data-open')); }
  });

  function render(s) {
    alertUsed = false;
    /* The strings build in page order, so the first failed block on the page is the one alert. */
    var html = verdict(s) + '<div class="ovw-split">' + needs(s) + route(s) + stats(s) + '</div>' +
      '<div class="ovw-lower">' + matrix(s) + '<div class="ovw-stack">' + pulse(s) + commitments(s) + activity(s) + '</div></div>' + weather(s);
    document.getElementById('ovw').innerHTML = html;
    var m = document.getElementById('rmap'); if (m) { m.appendChild(buildMap(routeData(NPTS))); fitPins(m); }
    syncList();
    var mb = document.getElementById('moreBtn');
    if (mb) mb.addEventListener('click', function () {
      var rows = document.getElementById('moreRows'), open = rows.hidden;
      rows.hidden = !open; mb.setAttribute('aria-expanded', String(open)); mb.textContent = open ? 'Show fewer' : (WARN.length - 3) + ' more warnings';
    });
    wireMatrix();
    document.getElementById('note').innerHTML = '<p class="mock-note">' + notes[s] + '</p>';
    Array.prototype.forEach.call(document.querySelectorAll('.mock-bar [data-state]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-state') === s)); });
  }

  /* ---------- theme, guides and state from the URL ---------- */
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    var b = document.getElementById('themeBtn'); b.setAttribute('aria-pressed', String(t === 'dark')); b.textContent = t === 'dark' ? 'Dark (on)' : 'Dark';
  }
  var t0 = qs.get('theme');
  if (t0 !== 'light' && t0 !== 'dark') t0 = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  setTheme(t0);
  if (qs.get('guides') === '1') {
    document.body.classList.add('guide-on');
    var cont = document.querySelector('.container'); cont.setAttribute('data-w', 'Container ' + getComputedStyle(cont).maxWidth + ' (normal tabs)');
    var gw = document.createElement('div'); gw.className = 'guide-wide'; gw.setAttribute('aria-hidden', 'true');
    gw.innerHTML = '<span>Board and Map ' + getComputedStyle(root).getPropertyValue('--container-wide').trim() + '</span>'; document.body.appendChild(gw);
  }
  document.getElementById('themeBtn').addEventListener('click', function () {
    var n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(n); qs.set('theme', n); history.replaceState(null, '', '?' + qs.toString());
  });
  var s0 = qs.get('state'); if (STATES.indexOf(s0) < 0) s0 = 'ready';
  render(s0);
  Array.prototype.forEach.call(document.querySelectorAll('.mock-bar [data-state]'), function (b) {
    b.addEventListener('click', function () {
      var n = b.getAttribute('data-state'); qs.set('state', n); history.replaceState(null, '', '?' + qs.toString()); render(n);
    });
  });
})();
</script>
