<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="YatraFlow — plan realistic India trips together. See the time, distance and cost impact of every stop." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF7F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1420" />
    <!-- Social preview defaults. The app routes on the hash, so `/#/pub/<id>`
         never reaches a server and a shared itinerary would preview as a bare
         URL; `/i/<id>` is a real path, rewritten to `api/i.js`, which replaces
         the whole block below with that itinerary's own tags. These are what a
         link to the site itself (or an unreadable publication) falls back to.

         Deliberately no `og:image`: there is no web-facing raster asset in the
         repo yet, and a 404 image renders worse than no image. `api/i.js`
         emits one when the publication carries a cover. Add a 1200x630 PNG
         under `public/` and reference it here to give site links a card image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YatraFlow" />
    <meta property="og:title" content="YatraFlow — Plan real trips, together" />
    <meta property="og:description" content="Plan realistic India trips together. See the time, distance and cost impact of every stop." />
    <meta property="og:url" content="https://yatraflow-blond.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="YatraFlow — Plan real trips, together" />
    <meta name="twitter:description" content="Plan realistic India trips together. See the time, distance and cost impact of every stop." />
    <link rel="canonical" href="https://yatraflow-blond.vercel.app/" />
    <title>YatraFlow — Plan real trips, together</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230B2545'/%3E%3Cpath d='M28 62 L44 34 L56 52 L64 40 L76 62 Z' fill='%230D8D82'/%3E%3Ccircle cx='66' cy='30' r='7' fill='%23F59E2D'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
