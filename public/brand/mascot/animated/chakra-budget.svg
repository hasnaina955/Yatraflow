<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-budget"><style>
#a-budget .blink,#a-budget .wing,#a-budget .fwing,#a-budget .bwing,#a-budget .tuft,#a-budget .bob,#a-budget .hop,#a-budget .breathe,#a-budget .float,#a-budget .twinkle,#a-budget .zz,#a-budget .tear,#a-budget .sweat,#a-budget .spin,#a-budget .coin,#a-budget .steam path,#a-budget .conf>*,#a-budget .dots circle,#a-budget .puffs path,#a-budget .star{transform-box:fill-box;transform-origin:center}
#a-budget .blink{animation:a-budget-blink 4.6s infinite}
#a-budget .tuft{transform-origin:50% 100%;animation:a-budget-sway 3.4s ease-in-out infinite}
@keyframes a-budget-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-budget-sway{50%{transform:rotate(7deg)}}
#a-budget .coin{animation:a-budget-fly 2.8s cubic-bezier(.4,0,.6,1) infinite}
@keyframes a-budget-fly{0%{transform:translate(0,4px)}50%{transform:translate(10px,-8px)}100%{transform:translate(0,4px)}}
#a-budget .cw{transform-box:fill-box;transform-origin:center;animation:a-budget-flut .35s ease-in-out infinite alternate}@keyframes a-budget-flut{to{transform:scaleY(.55)}}
#a-budget .sweat{animation:a-budget-sweat 2.8s ease-in infinite}@keyframes a-budget-sweat{0%,40%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}
#a-budget .wing{transform-origin:28% 17%;animation:a-budget-reach 2.8s ease-in-out infinite}@keyframes a-budget-reach{50%{transform:rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){#a-budget *{animation:none!important}}
</style><defs>
