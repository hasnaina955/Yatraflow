<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-celebrate"><style>
#a-celebrate .blink,#a-celebrate .wing,#a-celebrate .fwing,#a-celebrate .bwing,#a-celebrate .tuft,#a-celebrate .bob,#a-celebrate .hop,#a-celebrate .breathe,#a-celebrate .float,#a-celebrate .twinkle,#a-celebrate .zz,#a-celebrate .tear,#a-celebrate .sweat,#a-celebrate .spin,#a-celebrate .coin,#a-celebrate .steam path,#a-celebrate .conf>*,#a-celebrate .dots circle,#a-celebrate .puffs path,#a-celebrate .star{transform-box:fill-box;transform-origin:center}
#a-celebrate .blink{animation:a-celebrate-blink 4.6s infinite}
#a-celebrate .tuft{transform-origin:50% 100%;animation:a-celebrate-sway 3.4s ease-in-out infinite}
@keyframes a-celebrate-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-celebrate-sway{50%{transform:rotate(7deg)}}
#a-celebrate .hop{transform-origin:50% 100%;animation:a-celebrate-hop 1.3s cubic-bezier(.3,0,.5,1) infinite}
@keyframes a-celebrate-hop{0%{transform:translateY(0) scale(1.04,.96)}30%{transform:translateY(-16px) scale(.97,1.03)}55%{transform:translateY(0) scale(1.05,.95)}70%,100%{transform:translateY(0) scale(1)}}
#a-celebrate .conf>*{animation:a-celebrate-fall 2.2s linear infinite}@keyframes a-celebrate-fall{0%{opacity:0;transform:translateY(-10px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(70px) rotate(240deg)}}
#a-celebrate .twinkle{animation:a-celebrate-tw 1.3s ease-in-out infinite}@keyframes a-celebrate-tw{50%{transform:scale(.6);opacity:.5}}
#a-celebrate .wing{transform-origin:28% 17%;animation:a-celebrate-cheer .65s ease-in-out infinite alternate}@keyframes a-celebrate-cheer{to{transform:rotate(-18deg)}}
@media (prefers-reduced-motion:reduce){#a-celebrate *{animation:none!important}}
</style><defs>
