<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-lost"><style>
#a-lost .blink,#a-lost .wing,#a-lost .fwing,#a-lost .bwing,#a-lost .tuft,#a-lost .bob,#a-lost .hop,#a-lost .breathe,#a-lost .float,#a-lost .twinkle,#a-lost .zz,#a-lost .tear,#a-lost .sweat,#a-lost .spin,#a-lost .coin,#a-lost .steam path,#a-lost .conf>*,#a-lost .dots circle,#a-lost .puffs path,#a-lost .star{transform-box:fill-box;transform-origin:center}
#a-lost .blink{animation:a-lost-blink 4.6s infinite}
#a-lost .tuft{transform-origin:50% 100%;animation:a-lost-sway 3.4s ease-in-out infinite}
@keyframes a-lost-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-lost-sway{50%{transform:rotate(7deg)}}
#a-lost .spin{animation:a-lost-spin 2.4s linear infinite}@keyframes a-lost-spin{to{transform:rotate(360deg)}}
#a-lost .bob{transform-origin:50% 100%;animation:a-lost-wob 2.4s ease-in-out infinite}@keyframes a-lost-wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#a-lost .float{animation:a-lost-blinkfx 1.6s ease-in-out infinite}@keyframes a-lost-blinkfx{50%{opacity:.35}}
#a-lost .march{animation:none}
@media (prefers-reduced-motion:reduce){#a-lost *{animation:none!important}}
</style><defs>
