<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-love"><style>
#a-love .blink,#a-love .wing,#a-love .fwing,#a-love .bwing,#a-love .tuft,#a-love .bob,#a-love .hop,#a-love .breathe,#a-love .float,#a-love .twinkle,#a-love .zz,#a-love .tear,#a-love .sweat,#a-love .spin,#a-love .coin,#a-love .steam path,#a-love .conf>*,#a-love .dots circle,#a-love .puffs path,#a-love .star{transform-box:fill-box;transform-origin:center}
#a-love .blink{animation:a-love-blink 4.6s infinite}
#a-love .tuft{transform-origin:50% 100%;animation:a-love-sway 3.4s ease-in-out infinite}
@keyframes a-love-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-love-sway{50%{transform:rotate(7deg)}}
#a-love .float{animation:a-love-up 2.4s ease-out infinite}@keyframes a-love-up{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-18px) scale(1.05)}}
#a-love .blink{animation:a-love-beat 1.2s ease-in-out infinite}@keyframes a-love-beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
#a-love .bob{animation:a-love-bob 2.4s ease-in-out infinite}@keyframes a-love-bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#a-love *{animation:none!important}}
