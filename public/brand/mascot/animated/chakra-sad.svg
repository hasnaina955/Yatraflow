<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-sad"><style>
#a-sad .blink,#a-sad .wing,#a-sad .fwing,#a-sad .bwing,#a-sad .tuft,#a-sad .bob,#a-sad .hop,#a-sad .breathe,#a-sad .float,#a-sad .twinkle,#a-sad .zz,#a-sad .tear,#a-sad .sweat,#a-sad .spin,#a-sad .coin,#a-sad .steam path,#a-sad .conf>*,#a-sad .dots circle,#a-sad .puffs path,#a-sad .star{transform-box:fill-box;transform-origin:center}
#a-sad .blink{animation:a-sad-blink 4.6s infinite}
#a-sad .tuft{transform-origin:50% 100%;animation:a-sad-sway 3.4s ease-in-out infinite}
@keyframes a-sad-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-sad-sway{50%{transform:rotate(7deg)}}
#a-sad .breathe{transform-origin:50% 100%;animation:a-sad-sigh 4.2s ease-in-out infinite}@keyframes a-sad-sigh{50%{transform:scale(1.02,.97)}}
#a-sad .tuft{animation:none}
#a-sad .tear{animation:a-sad-tear 2.6s ease-in infinite}@keyframes a-sad-tear{0%,30%{opacity:0;transform:translateY(-4px)}45%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){#a-sad *{animation:none!important}}
