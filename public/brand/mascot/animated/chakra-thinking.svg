<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-thinking"><style>
#a-thinking .blink,#a-thinking .wing,#a-thinking .fwing,#a-thinking .bwing,#a-thinking .tuft,#a-thinking .bob,#a-thinking .hop,#a-thinking .breathe,#a-thinking .float,#a-thinking .twinkle,#a-thinking .zz,#a-thinking .tear,#a-thinking .sweat,#a-thinking .spin,#a-thinking .coin,#a-thinking .steam path,#a-thinking .conf>*,#a-thinking .dots circle,#a-thinking .puffs path,#a-thinking .star{transform-box:fill-box;transform-origin:center}
#a-thinking .blink{animation:a-thinking-blink 4.6s infinite}
#a-thinking .tuft{transform-origin:50% 100%;animation:a-thinking-sway 3.4s ease-in-out infinite}
@keyframes a-thinking-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-thinking-sway{50%{transform:rotate(7deg)}}
#a-thinking .dots circle{animation:a-thinking-dot 1.4s ease-in-out infinite}#a-thinking .dots circle:nth-child(2){animation-delay:.2s}#a-thinking .dots circle:nth-child(3){animation-delay:.4s}
@keyframes a-thinking-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
#a-thinking .bob{animation:a-thinking-bob 3.4s ease-in-out infinite}@keyframes a-thinking-bob{50%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){#a-thinking *{animation:none!important}}
</style><defs>
